name: Changelog

# Публикация changelog на GitHub Pages — наследство апстрима. У нашего форка
# Pages не включены, поэтому шаг deploy падает с 404 «Ensure GitHub Pages has
# been enabled», а публиковать он стал бы changelog ТЕЛЕГРАМА. Автозапуск снят:
# после уборки веток dev — рабочая ветка, и каждый пуш, задевающий changelog.txt,
# давал красный прогон на ровном месте. Включать обратно — только вместе с
# Pages и своим changelog.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate HTML
        run: python .github/scripts/generate_changelog.py

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
