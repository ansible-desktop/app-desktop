name: MacOS Packaged.

# Сборка macOS против СИСТЕМНЫХ библиотек Homebrew — вариант для упаковщиков
# дистрибутивов. Обычную сборку macOS даёт mac.yml, и наш артефакт берётся
# оттуда; этот воркфлоу второй по счёту и ничего своего не поставляет.
#
# История, чтобы не повторять: на переходе к 7.2.8 воркфлоу перестал
# конфигурироваться — апстрим заменил rlottie на tlottie, а здесь эта
# библиотека не бралась НИОТКУДА (формулы brew нет, среди клонируемых
# исходников её тоже не было). Автозапуск снимали 20.09.2026, вернули
# 23.09.2026, когда появился шаг сборки tlottie из исходников.
on:
  # Ручной запуск с выбором ветки: позволяет проверить правку, не вливая её
  # в master.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / SHA to build (default: ref this is launched from).'
        required: false
        type: string
  push:
    # Тяжёлая матрица живёт только на master — как у остальных четырёх.
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/mac_packaged.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Ansible/build/**'
      - 'Ansible/Resources/uwp/**'
      - 'Ansible/Resources/winrc/**'
      - 'Ansible/SourceFiles/platform/win/**'
      - 'Ansible/SourceFiles/platform/linux/**'
      - 'Ansible/configure.bat'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/mac_packaged.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Ansible/build/**'
      - 'Ansible/Resources/uwp/**'
      - 'Ansible/Resources/winrc/**'
      - 'Ansible/SourceFiles/platform/win/**'
      - 'Ansible/SourceFiles/platform/linux/**'
      - 'Ansible/configure.bat'

jobs:

  macos:
    name: MacOS
    runs-on: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/nightly') && 'depot-macos-latest' || 'macos-latest' }}

    strategy:
      matrix:
        defines:
          - ""

    env:
      GIT: "https://github.com"
      CMAKE_GENERATOR: "Ninja"
      CMAKE_BUILD_TYPE: "Debug"
      CMAKE_BUILD_PARALLEL_LEVEL: ""
      CMAKE_PREFIX_PATH: "/opt/homebrew/opt/ffmpeg@6:/opt/homebrew/opt/openal-soft"
      TDE2E: "51743dfd01dff6179e2d8f7095729caa4e2222e9"
      # Держать в синхроне с Ansible/build/prepare/prepare.py:
      # стадия tlottie (ревизия) и rustToolchain (версия cargo).
      TLOTTIE: "4b940c7942"
      RUST_TOOLCHAIN: "1.96.1"
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      MANUAL_CACHING: "1"
      AUTO_CACHING: "1"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          libs="ada-url ffmpeg@6 jpeg-xl libavif libheif minizip openal-soft openh264 openssl opus qtbase qtimageformats qtshadertools qtsvg xz"
          brew update
          brew upgrade || true
          brew install autoconf automake boost cmake libtool ninja pkg-config python $libs
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

          xcodebuild -version > CACHE_KEY.txt
          brew list --versions $libs >> CACHE_KEY.txt
          echo $MANUAL_CACHING >> CACHE_KEY.txt
          echo "$GITHUB_WORKSPACE" >> CACHE_KEY.txt
          if [ "$AUTO_CACHING" = "1" ]; then
            thisFile=$REPO_NAME/.github/workflows/mac_packaged.yml
            echo `md5 -q $thisFile` >> CACHE_KEY.txt
          fi
          echo "CACHE_KEY=`md5 -q CACHE_KEY.txt`" >> $GITHUB_ENV

          echo "MACOSX_DEPLOYMENT_TARGET=$(grep 'set(QT_SUPPORTED_MIN_MACOS_VERSION' /opt/homebrew/Cellar/qtbase/*/lib/cmake/Qt6/Qt6ConfigExtras.cmake | sed -E 's/^.*"(.*)"\)$/\1/')" >> $GITHUB_ENV
          echo "LibrariesPath=`pwd`" >> $GITHUB_ENV

          echo "RNNOISE=`curl -sSL --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' https://api.github.com/repos/xiph/rnnoise/git/refs/heads/master | jq -r .object.sha`" >> $GITHUB_ENV
          echo "WEBRTC=`curl -sSL --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' https://api.github.com/repos/desktop-app/tg_owt/git/refs/heads/master | jq -r .object.sha`" >> $GITHUB_ENV

      - name: RNNoise cache.
        id: cache-rnnoise
        uses: actions/cache@v6
        with:
          path: ${{ env.LibrariesPath }}/local/rnnoise
          key: ${{ runner.OS }}-rnnoise-${{ env.RNNOISE }}-${{ env.CACHE_KEY }}
      - name: RNNoise.
        if: steps.cache-rnnoise.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git clone --depth=1 $GIT/xiph/rnnoise.git
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=$LibrariesPath/local/rnnoise --disable-examples --disable-doc
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: WebRTC cache.
        id: cache-webrtc
        uses: actions/cache@v6
        with:
          path: ${{ env.LibrariesPath }}/local/tg_owt
          key: ${{ runner.OS }}-webrtc-${{ env.WEBRTC }}-${{ env.CACHE_KEY }}
      - name: WebRTC.
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git clone --depth=1 --recursive --shallow-submodules $GIT/desktop-app/tg_owt.git
          cd tg_owt

          cmake -Bbuild . -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tg_owt
          cmake --build build
          cmake --install build

      - name: TDE2E cache.
        id: cache-tde2e
        uses: actions/cache@v6
        with:
          path: ${{ env.LibrariesPath }}/local/tde2e
          key: ${{ runner.OS }}-tde2e-${{ env.TDE2E }}-${{ env.CACHE_KEY }}
      - name: TDE2E.
        if: steps.cache-tde2e.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git init tde2e
          cd tde2e
          git remote add origin $GIT/tdlib/td.git
          git fetch --depth=1 origin $TDE2E
          git reset --hard FETCH_HEAD

          cmake -Bbuild . -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tde2e -DTD_E2E_ONLY=ON
          cmake --build build
          cmake --install build

      - name: tlottie cache.
        id: cache-tlottie
        uses: actions/cache@v6
        with:
          path: ${{ env.LibrariesPath }}/local/tlottie
          key: ${{ runner.OS }}-tlottie-${{ env.TLOTTIE }}-${{ env.RUST_TOOLCHAIN }}-${{ env.CACHE_KEY }}
      - name: tlottie.
        if: steps.cache-tlottie.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          # 🚨 Архитектуру берём у uname, а НЕ у `rustc -vV`: на раннере
          # rustup стоит без активного тулчейна, rustc в PATH нет, и
          # подстановка молча давала пустую строку — `rustup target add`
          # падал на «required arguments were not provided». Хостовая цель у
          # только что поставленного тулчейна и так есть, добавлять не нужно.
          rustup toolchain install $RUST_TOOLCHAIN --profile minimal
          case "$(uname -m)" in
            arm64|aarch64) HOST=aarch64-apple-darwin ;;
            *)             HOST=x86_64-apple-darwin ;;
          esac
          echo "tlottie target: $HOST"

          # 🚨 Каталог с rustc и cargo СПРАШИВАЕМ У RUSTUP, а не угадываем.
          # На раннере стоит rustup из Homebrew («self-update is disabled for
          # this build»), он не создаёт шимы в ~/.cargo/bin, поэтому и
          # `rustup run`, и добавление CARGO_HOME/bin в PATH дали
          # «rustc: command not found» — каждый раз на шаг позже.
          # `rustup which --toolchain` работает без активного тулчейна и
          # отвечает абсолютным путём, какой бы ни была раскладка.
          TOOLCHAIN_BIN="$(dirname "$(rustup which --toolchain $RUST_TOOLCHAIN rustc)")"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          echo "toolchain bin: $TOOLCHAIN_BIN"
          rustc -vV
          cargo -V

          git clone $GIT/dkaraush/tlottie.git
          cd tlottie
          git checkout $TLOTTIE

          # Только дуга раннера: этот вариант всё равно линкуется с
          # однодуговыми библиотеками Homebrew. prepare.py делает lipo из
          # двух дуг для релиза, здесь это лишняя половина времени.
          cargo rustc --lib --release --locked \
            --features c-api --crate-type staticlib \
            --target $HOST \
            -- --print native-static-libs

          PREFIX=$LibrariesPath/local/tlottie
          mkdir -p $PREFIX/lib $PREFIX/include/tlottie
          cp target/$HOST/release/libtlottie.a $PREFIX/lib/libtlottie.a
          cp include/tlottie.h $PREFIX/include/tlottie/tlottie.h

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME
          export CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH$(find $LibrariesPath/local -mindepth 1 -maxdepth 1 -type d -exec printf ':%s' {} +)"

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Ansible ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Ansible" >> $GITHUB_ENV
          fi

          cmake -Bbuild . -DTDESKTOP_API_TEST=ON $DEFINE
          cmake --build build
          macdeployqt build/Ansible.app
          codesign --remove-signature build/Ansible.app

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd $REPO_NAME/build
          mkdir artifact
          mv Ansible.app artifact/
      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPO_NAME }}/build/artifact/
          retention-days: 1
