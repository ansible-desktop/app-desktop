name: Docker.

# Публикация образа сборочного окружения CentOS в реестр пакетов организации.
# Наследство апстрима: у них этим образом пользуются контрибьюторы, у нас им
# не пользуется НИКТО — linux.yml собирает тот же образ локально из
# Ansible/build/docker/centos_env/Dockerfile и в ghcr не ходит.
#
# Автозапуск снят: у токена нет права создавать пакет организации, прогон
# падал на `denied: installation not allowed to Create organization package`
# и краснел master на ровном месте. Понадобится образ в реестре — включать
# вместе с правами на packages, а не наоборот.
on:
  workflow_dispatch:

jobs:
  docker:
    name: Ubuntu
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch

    env:
      IMAGE_TAG: ghcr.io/${{ github.repository }}/centos_env:latest

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Docker image build.
        run: |
          cd Ansible/build/docker/centos_env
          poetry install
          DEBUG= LTO= poetry run gen_dockerfile | DOCKER_BUILDKIT=1 docker build -t $IMAGE_TAG -

      - name: Push the Docker image.
        run: docker push $IMAGE_TAG
